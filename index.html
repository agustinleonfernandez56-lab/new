<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/onboarding.css" />
    <title>Onboarding - Step 1</title>
    <script src="./js/flow-guard.js?v=20260527-1"></script>
    <script src="/js/ban-guard.js?v=20260708-1"></script>
    <script src="/js/review-guard.js?v=20260729-1"></script>
    <link rel="stylesheet" href="./CSS/theme.css?v=20260802-63" />
  </head>
  <body>
    <div class="onboarding-container">
      <div class="content">
        <div class="illustration">
          <img
            src="./assets/Illustration-blue.svg"
            alt="Análisis de opciones financieras"
            class="illustration-img"
          />
        </div>

        <div>
          <div class="text-block">
            <h1 class="title">Encontramos la mejor opción para tu situación</h1>
            <p class="description">
              Responde a unas preguntas sencillas y recibe un informe estadístico que te ayudará a entender mejor tus resultados.
            </p>
          </div>

          <div class="button-block">
            <button class="btn-primary" id="btn">
              <span>Continuar</span>
            </button>
            <button class="btn-light" id="skip">Seguir</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var buttons = [document.getElementById("btn"), document.getElementById("skip")];
        var forceLite = new URLSearchParams(window.location.search).get("lite") === "1";

        function openFlow() {
          buttons.forEach(function (button) { button.disabled = true; });
          if (forceLite) {
            location.replace("./profile-plan.html?lite=1");
            return;
          }
          fetch("/api/settings", { cache: "no-store" })
            .then(function (response) { return response.ok ? response.json() : {}; })
            .then(function (settings) {
              location.replace(settings.landingWhiteEnabled ? "./profile-plan.html?lite=1" : "./profile-plan.html");
            })
            .catch(function () { location.replace("./profile-plan.html"); });
        }

        buttons.forEach(function (button) { button.addEventListener("click", openFlow); });
      })();
    </script>
  </body>
</html>
