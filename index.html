<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#ffffff" />
    <title>AvalAvance</title>
    <link rel="stylesheet" href="./lite/styles.css" />

  <body data-page="home">

        <div class="brand-mark" aria-label="AvalAvance">

        <img class="welcome-card__image" src="./assets/Illustration-blue.svg" alt="Análisis de opciones" />

          <span class="eyebrow">INFORME PERSONAL</span>
          <h1>Encuentra una opción adaptada a tus objetivos</h1>

        <button class="primary-button" type="button" data-start-lite>Continuar</button>
        <p class="privacy-copy">Al continuar aceptas nuestra <a href="./privacy-policy.html">Política de privacidad</a>.</p>
      </section>
    </main>
    <script src="./js/runtime-config.js"></script>
